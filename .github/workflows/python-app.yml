name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - name: Provide Streamlit secrets for CI
        run: |
          mkdir -p .streamlit
          printf 'APP_TARGET_AUDIENCE = "ALL"\n' > .streamlit/secrets.toml

      - name: Run tests
        run: |
          pytest -q --maxfail=1 --disable-warnings
